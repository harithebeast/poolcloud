name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-secret values used only by tests.
  DATABASE_URL: postgres://pooldrive:pooldrive@localhost:5432/pooldrive
  REDIS_URL: redis://localhost:6379
  TEST_DATABASE_URL: postgres://pooldrive:pooldrive@localhost:5432/pooldrive

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pooldrive
          POSTGRES_PASSWORD: pooldrive
          POSTGRES_DB: pooldrive
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pooldrive" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Unit and integration tests (fails below the coverage thresholds)
        run: pnpm test:ci
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  e2e:
    # Real browser tests plus a load test against an isolated stack with fake Google (ports 3100/4100).
    runs-on: ubuntu-latest
    needs: verify
    env:
      COMPOSE: docker compose -p pooldrive-e2e -f docker-compose.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate throwaway secrets for the test stack
        run: node scripts/init-env.mjs
      - name: Start the stack
        run: $COMPOSE up -d --build --wait --wait-timeout 300
      - run: pnpm --filter @pooldrive/web exec playwright install --with-deps chromium
      - name: Browser tests (journey + accessibility)
        run: pnpm --filter @pooldrive/web test:e2e
      - name: Load test
        env:
          API_URL: http://localhost:4100/api/v1
          E2E_EMAIL: owner@example.com
          E2E_PASSWORD: correct-horse-battery-staple
          FILES: '150'
          SIZE_KB: '128'
        run: node scripts/load-test.mjs
      - name: Keep evidence when something failed
        if: failure()
        run: |
          mkdir -p evidence
          $COMPOSE logs --no-color > evidence/stack.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-evidence
          path: |
            evidence/
            apps/web/test-results/
      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          for app in api worker web; do
            docker buildx build -f apps/$app/Dockerfile -t pooldrive-$app:ci .
          done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
