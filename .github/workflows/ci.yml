name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-secret values used only by tests.
  DATABASE_URL: postgres://pooldrive:pooldrive@localhost:5432/pooldrive
  REDIS_URL: redis://localhost:6379

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pooldrive
          POSTGRES_PASSWORD: pooldrive
          POSTGRES_DB: pooldrive
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pooldrive" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Unit and integration tests (coverage thresholds enforced per package)
        run: pnpm test
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          for app in api worker web; do
            docker buildx build -f apps/$app/Dockerfile -t pooldrive-$app:ci .
          done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
