name: pooldrive

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://pooldrive:${POSTGRES_PASSWORD:?run node scripts/init-env.mjs}@postgres:5432/pooldrive
  REDIS_URL: redis://redis:6379
  SESSION_SECRET: ${SESSION_SECRET:?run node scripts/init-env.mjs}
  MASTER_KEYS: ${MASTER_KEYS:?run node scripts/init-env.mjs}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-google}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4400/api/v1/accounts/google/callback}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-1200}
  CHUNK_SIZE_BYTES: ${CHUNK_SIZE_BYTES:-67108864}
  ENCRYPTED_CHUNK_BYTES: ${ENCRYPTED_CHUNK_BYTES:-16777216}
  HEADROOM_PERCENT: ${HEADROOM_PERCENT:-5}
  HEADROOM_MIN_BYTES: ${HEADROOM_MIN_BYTES:-100000000}
  QUOTA_SYNC_INTERVAL_SECONDS: ${QUOTA_SYNC_INTERVAL_SECONDS:-300}
  TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
  FEATURE_TOTP: ${FEATURE_TOTP:-false}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pooldrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run node scripts/init-env.mjs}
      POSTGRES_DB: pooldrive
    # A single-user pool needs very little: small caches and few connections (api 10 + worker 5).
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
    mem_limit: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pooldrive -d pooldrive']
      interval: 15s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Holds only the job queue and login counters. BullMQ needs noeviction; the worker re-creates
    # its schedules at start-up, so persistence is optional and off to save disk writes.
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    mem_limit: 96m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 15s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *app-env
      API_PORT: '4000'
      # Heap cap; file bytes stream through off-heap buffers (measured: flat memory for 5 GB).
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 512m
    healthcheck:
      interval: 30s
    # Host port 4400, not 4000: other tools (e.g. WSL) often occupy 4000 and browsers then hang.
    ports: ['${API_HOST_PORT:-4400}:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    environment:
      <<: *app-env
      NODE_OPTIONS: --max-old-space-size=128
    mem_limit: 256m
    healthcheck:
      interval: 30s
    depends_on:
      api: { condition: service_healthy }
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The browser calls the API directly; this address is baked into the web build.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4400/api/v1}
    ports: ['3000:3000']
    environment:
      NODE_OPTIONS: --max-old-space-size=128
    mem_limit: 256m
    healthcheck:
      interval: 30s
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
